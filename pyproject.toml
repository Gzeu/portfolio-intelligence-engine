[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-intelligence-engine"
version = "0.1.0"
description = "Portfolio Intelligence & Adaptive Decision Engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
